<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Organizer</title><link rel="stylesheet" href="popup.css"></head><body>
<header><div><h1 data-i18n="popupTitle">Organizer</h1><p data-i18n="popupSubtitle">Tabs and bookmarks, safely backed up.</p></div><button id="settings" class="icon" data-i18n-title="settingsButtonTitle" title="Settings">⚙</button></header>
<main>
  <section class="actions"><button id="organize-tabs">🤖 <span data-i18n="organizeTabsButton">Organize tabs</span></button><button id="organize-bookmarks">🤖 <span data-i18n="organizeBookmarksButton">Organize bookmarks</span></button><button id="save-close" data-i18n="saveCloseButton">Save as session & close</button><button id="save-tabs" data-i18n="saveTabsButton">Back up tabs</button><button id="save-bookmarks" data-i18n="saveBookmarksButton">Back up bookmarks</button></section>
  <div id="status" role="status"></div>
  <section id="ai-jobs" hidden><div class="section-title"><h2 data-i18n="aiProcessingHeading">AI processing</h2></div><div id="ai-jobs-list" class="list"></div></section>
  <section><div class="section-title"><h2 data-i18n="tabSessionsHeading">Tab sessions</h2><span><button data-export="tabSessions" class="small" data-i18n="exportButton">Export</button><button data-import="tabSessions" class="small" data-i18n="importButton">Import</button></span></div><div id="tabs-list" class="list"></div></section>
  <section><div class="section-title"><h2 data-i18n="bookmarkBackupsHeading">Bookmark backups</h2><span><button data-export="bookmarkBackups" class="small" data-i18n="exportButton">Export</button><button data-import="bookmarkBackups" class="small" data-i18n="importButton">Import</button></span></div><div id="bookmarks-list" class="list"></div></section>
</main><input id="file" type="file" accept="application/json" hidden><script src="../i18n.js"></script><script src="../permissions.js"></script><script src="popup.js"></script></body></html>
